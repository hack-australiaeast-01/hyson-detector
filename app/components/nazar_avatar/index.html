<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
  #wrap { position: relative; width: 100%; height: 400px; }
  canvas { display: block; }
  #bubble { position: absolute; top: 14px; right: 12px; max-width: 46%; padding: 10px 14px; border-radius: 16px;
    background: rgba(9, 22, 58, .88); color: #eaf3ff; font-size: 13.5px; line-height: 1.4; border: 1px solid rgba(80, 170, 255, .55);
    box-shadow: 0 0 22px rgba(60, 150, 255, .35); opacity: 0; transform: translateY(-6px); transition: all .35s ease; pointer-events: none; }
  #bubble.on { opacity: 1; transform: none; }
  #bubble b { color: #5cc8ff; }
  #mic { position: absolute; right: 16px; bottom: 16px; width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid #5cc8ff; background: radial-gradient(circle, #13306e, #08133a); color: #fff; font-size: 24px; cursor: pointer;
    box-shadow: 0 0 18px rgba(80, 180, 255, .55); display: none; }
  #mic.on { display: block; }
  #mic.live { background: radial-gradient(circle, #ff4d6d, #8a1030); border-color: #ff8fa3; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 10px rgba(255, 80, 110, .6); } 50% { box-shadow: 0 0 34px rgba(255, 80, 110, .95); } }
  #state { position: absolute; left: 12px; top: 12px; font-size: 12px; color: #3a6fd8; background: rgba(255, 255, 255, .8);
    border: 1px solid #c9d8f5; padding: 3px 10px; border-radius: 999px; }
  #hint { position: absolute; left: 12px; bottom: 14px; font-size: 11.5px; color: #6b7a99; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="wrap">
  <div id="state">🧿 Nazar</div>
  <div id="bubble"></div>
  <button id="mic" title="Push to talk">🎙</button>
  <div id="hint"></div>
</div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// ------------------------------------------------------------------ Streamlit bridge (no npm needed)
const send = (type, extra) => window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, "*");
let ARGS = { lang: "fr", voice: false, say: "", say_id: 0, height: 400 };
let lastSay = -1, heardId = 0, first = true;
window.addEventListener("message", (ev) => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  ARGS = Object.assign(ARGS, ev.data.args || {});
  wrap.style.height = ARGS.height + "px";
  resize();
  send("streamlit:setFrameHeight", { height: ARGS.height });
  mic.classList.toggle("on", !!ARGS.voice);
  hint.textContent = ARGS.voice ? T("Cliquez le micro et parlez · cliquez Nazar pour le saluer", "Click the mic and talk · click Nazar to say hi")
                                : T("Cliquez Nazar pour le saluer · il suit votre curseur", "Click Nazar to say hi · it follows your cursor");
  if (logoUrl !== ARGS.logo && ARGS.logo) setLogo(ARGS.logo);
  if (ARGS.say_id !== lastSay) {
    const fresh = lastSay !== -1 || ARGS.greet;
    lastSay = ARGS.say_id;
    if (ARGS.say && fresh) speak(ARGS.say, !!ARGS.voice); else if (first) wave();
    if (mood === "thinking") setMood("idle");
  }
  first = false;
});
const T = (fr, en) => (ARGS.lang === "en" ? en : fr);
const wrap = document.getElementById("wrap"), bubble = document.getElementById("bubble"), mic = document.getElementById("mic"),
      hint = document.getElementById("hint"), stateEl = document.getElementById("state");

// ------------------------------------------------------------------ scene
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);               // empty background
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0.2, 10.4);
camera.lookAt(0, -0.78, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c8e8, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(3, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0x6aa8ff, 1.6); rim.position.set(-5, 2, -4); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0x9fe0ff, 0.9); rim2.position.set(5, 0, -3); scene.add(rim2);

function resize() {
  const w = wrap.clientWidth || 600, h = wrap.clientHeight || 400;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// ------------------------------------------------------------------ materials (minimal: one pearl white, one glass, one light)
const pearl = new THREE.MeshPhysicalMaterial({ color: 0xf6f8fc, roughness: 0.36, clearcoat: 1, clearcoatRoughness: 0.18, sheen: 0.4,
                                               sheenColor: new THREE.Color(0xdbe8ff), sheenRoughness: 0.6 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x050a18, roughness: 0.04, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.02,
                                               reflectivity: 0.6 });
const seamMat = new THREE.MeshBasicMaterial({ color: 0xc9d6ea });
const glow = new THREE.MeshStandardMaterial({ color: 0x7fd6ff, emissive: 0x4cc2ff, emissiveIntensity: 2.4, toneMapped: false });
const M = (geo, mat, parent, pos = [0, 0, 0], scale = [1, 1, 1], rot = [0, 0, 0]) => {
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.scale.set(...scale); m.rotation.set(...rot); parent.add(m); return m;
};
function radial(stops, size = 256) {
  const c = document.createElement("canvas"); c.width = c.height = size; const g = c.getContext("2d");
  const r = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => r.addColorStop(o, col)); g.fillStyle = r; g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
function halo(parent, pos, size, alpha = .5) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: radial([[0, `rgba(70,160,255,${alpha * 0.45})`], [1, "rgba(70,160,255,0)"]]),
                                                         blending: THREE.NormalBlending, depthWrite: false, transparent: true }));
  s.position.set(...pos); s.scale.set(size, size, 1); parent.add(s); return s;
}
// rounded pill for the eyes (a capsule flattened in depth)
const pill = (w, h) => new THREE.CapsuleGeometry(w / 2, Math.max(0.001, h - w), 8, 24);

// ------------------------------------------------------------------ the robot
const robot = new THREE.Group(); scene.add(robot);
const body = new THREE.Group(); robot.add(body);
// body: a floating egg with one thin seam of light
const torso = M(new THREE.SphereGeometry(1, 96, 64), pearl, body, [0, -1.72, 0], [0.98, 1.18, 0.9]);
const seam = M(new THREE.TorusGeometry(1, 0.012, 8, 160), glow, body, [0, -1.52, 0], [0.955, 0.875, 1], [Math.PI / 2 - 0.05, 0, 0]);
seam.material = new THREE.MeshStandardMaterial({ color: 0x9ddcff, emissive: 0x4cc2ff, emissiveIntensity: 1.2, toneMapped: false, transparent: true, opacity: .75 });
// small emblem: the Hyson logo on a glass disc
M(new THREE.CylinderGeometry(0.27, 0.27, 0.03, 64), glass, body, [0, -1.25, 0.86], [1, 1, 1], [Math.PI / 2 - 0.22, 0, 0]);
const logoMat = new THREE.MeshBasicMaterial({ transparent: true, toneMapped: false, color: 0xa9dcff });
const logo = M(new THREE.CircleGeometry(0.21, 48), logoMat, body, [0, -1.247, 0.885], [1, 1, 1], [-0.22, 0, 0]);
logo.visible = false;
let logoUrl = null;
function setLogo(url) { logoUrl = url; new THREE.TextureLoader().load(url, (t) => { t.colorSpace = THREE.SRGBColorSpace; logoMat.map = t; logoMat.needsUpdate = true; logo.visible = true; }); }
// floating hands (no arms: cleaner, and they can wave freely)
const arms = {};
for (const side of [-1, 1]) {
  const shoulder = new THREE.Group(); shoulder.position.set(side * 1.22, -1.55, 0.05); body.add(shoulder);
  const elbow = new THREE.Group(); shoulder.add(elbow);
  const hand = M(new THREE.SphereGeometry(0.27, 48, 32), pearl, elbow, [0, 0, 0], [0.62, 1.18, 0.62], [0, 0, side * 0.18]);
  arms[side] = { shoulder, elbow, hand };
}
const R = arms[-1];
// neck: a soft gap of light (the head floats)
const neckGlow = halo(body, [0, -0.42, 0], 1.0, .28);
M(new THREE.CylinderGeometry(0.22, 0.26, 0.12, 48), seamMat, body, [0, -0.47, 0]);
// head: one smooth rounded shape with a glass face
const head = new THREE.Group(); head.position.set(0, 0.42, 0); body.add(head);
M(new THREE.SphereGeometry(1, 96, 64), pearl, head, [0, 0, 0], [1.22, 0.92, 1.0]);
const face = M(new THREE.SphereGeometry(1, 96, 64), glass, head, [0, -0.02, 0.24], [1.04, 0.72, 0.84]);
// eyes: two soft pills that blink, squint when happy, become rings when listening
const eyes = new THREE.Group(); eyes.position.set(0, 0.06, 1.06); head.add(eyes);
const eye = {};
for (const side of [-1, 1]) {
  const g = new THREE.Group(); g.position.set(side * 0.34, 0, 0); eyes.add(g);
  const arc = M(pill(0.2, 0.34), glow, g, [0, 0, 0], [1, 1, 0.35]);
  const ring = M(new THREE.TorusGeometry(0.12, 0.035, 12, 48), glow, g); ring.visible = false;
  eye[side] = { g, arc, ring };
}
// mouth: five rounded dots that become a small equalizer when Nazar talks
const mouth = new THREE.Group(); mouth.position.set(0, -0.36, 1.0); mouth.rotation.x = -0.32; head.add(mouth);
const bars = [];
for (let i = 0; i < 5; i++) bars.push(M(pill(0.05, 0.05), glow, mouth, [-0.16 + i * 0.08, 0, 0], [1, 1, 0.5]));
// one antenna with a light
const tips = [];
const ant = new THREE.Group(); ant.position.set(0, 0.9, -0.05); head.add(ant);
M(new THREE.CylinderGeometry(0.018, 0.03, 0.34, 16), seamMat, ant, [0, 0.16, 0]);
tips.push(M(new THREE.SphereGeometry(0.065, 24, 16), glow, ant, [0, 0.36, 0]));
halo(ant, [0, 0.36, 0], 0.5, .6);
// ear pods
for (const side of [-1, 1]) {
  M(new THREE.SphereGeometry(0.2, 48, 32), pearl, head, [side * 1.2, -0.02, 0], [0.45, 1, 1]);
  M(new THREE.TorusGeometry(0.13, 0.012, 8, 48), glow, head, [side * 1.29, -0.02, 0], [1, 1, 1], [0, Math.PI / 2, 0]);
}
// floor: a soft contact shadow + one faint light ring (no grid, no clutter)
const base = new THREE.Group(); base.position.y = -3.25; scene.add(base);
const shadow = M(new THREE.PlaneGeometry(3.6, 3.6), new THREE.MeshBasicMaterial({ map: radial([[0, "rgba(20,45,110,.38)"], [.55, "rgba(20,45,110,.10)"], [1, "rgba(20,45,110,0)"]]),
                 transparent: true, depthWrite: false }), base, [0, 0, 0], [1, 1, 1], [-Math.PI / 2, 0, 0]);
const rings = [M(new THREE.TorusGeometry(1.55, 0.008, 8, 160), new THREE.MeshBasicMaterial({ color: 0x6cc4ff, transparent: true, opacity: .55, toneMapped: false }),
                 base, [0, 0.01, 0], [1, 1, 1], [Math.PI / 2, 0, 0])];

// ------------------------------------------------------------------ behaviour
let mood = "idle", talkUntil = 0, energy = 0, waveUntil = 0, jumpAt = -9, blinkAt = performance.now() + 2500, blinkStart = -999;
const target = new THREE.Vector2(), look = new THREE.Vector2();
function setMood(m) {
  mood = m;
  stateEl.textContent = { idle: "🧿 Nazar", listening: T("🎙 J'écoute…", "🎙 Listening…"), thinking: T("💭 Je réfléchis…", "💭 Thinking…"),
                          talking: T("🗣 Nazar parle", "🗣 Nazar is talking") }[m];
  for (const s of [-1, 1]) { eye[s].arc.visible = m !== "listening"; eye[s].ring.visible = m === "listening"; }
}
function wave() { waveUntil = performance.now() + 2200; }
function showBubble(text) {
  const short = text.length > 170 ? text.slice(0, 167) + "…" : text;
  const esc = short.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  bubble.innerHTML = esc.replace(/(Nazar|Hyson)/g, "<b>$1</b>");     // escape first: replies may echo typed or LLM text
  bubble.classList.add("on");
  clearTimeout(showBubble.t); showBubble.t = setTimeout(() => bubble.classList.remove("on"), 4000 + short.length * 45);
}
const clean = (s) => String(s).replace(/```[\s\S]*?```/g, " ").replace(/[`*_#>|]/g, "").replace(/\[(.*?)\]\(.*?\)/g, "$1")
  .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "").replace(/\s+/g, " ").trim();
function pickVoice() {
  const want = ARGS.lang === "en" ? "en" : "fr";
  const vs = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith(want));
  return vs.find((v) => /natural|neural|online|google/i.test(v.name)) || vs[0] || null;
}
function speak(text, aloud) {
  const t = clean(text); if (!t) return;
  showBubble(t);
  setMood("talking");
  if (aloud && "speechSynthesis" in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.slice(0, 700));
    u.lang = ARGS.lang === "en" ? "en-US" : "fr-FR"; u.voice = pickVoice(); u.rate = 1.03; u.pitch = 1.12;
    u.onboundary = () => { energy = 1; };
    u.onend = () => { talkUntil = 0; setMood("idle"); };
    talkUntil = performance.now() + 60000;
    speechSynthesis.speak(u);
  } else {
    talkUntil = performance.now() + Math.min(9000, 900 + t.length * 38);
  }
}
// cursor tracking: whole page when allowed (same-origin iframe), otherwise inside the frame
function track(x, y, w, h) { target.set(THREE.MathUtils.clamp((x / w) * 2 - 1, -1, 1), THREE.MathUtils.clamp(-((y / h) * 2 - 1), -1, 1)); }
try {
  const pd = window.parent.document, fe = window.frameElement;
  pd.addEventListener("mousemove", (e) => {
    const r = fe.getBoundingClientRect();
    track(e.clientX - r.left, e.clientY - r.top - r.height * 0.15, r.width, r.height);
  });
} catch (e) { /* cross-origin: fall back to local tracking */ }
window.addEventListener("mousemove", (e) => track(e.clientX, e.clientY - wrap.clientHeight * 0.15, wrap.clientWidth, wrap.clientHeight));
// click Nazar: hop, wave and say hi (local, 0 token)
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener("click", (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  if (!ray.intersectObject(robot, true).length) return;
  jumpAt = performance.now(); wave();
  const lines = ARGS.lang === "en"
    ? ["Hey! I'm Nazar, the eye of Hyson. Ask me anything about the alerts.", "Careful, I'm watching every transaction 👀", "Ready when you are: say \"my tasks\"."]
    : ["Salut ! Je suis Nazar, l'œil de Hyson. Demandez-moi n'importe quoi sur les alertes.", "Attention, je surveille chaque transaction 👀", "Je suis prêt : dites « mes tâches »."];
  speak(lines[Math.floor(Math.random() * lines.length)], !!ARGS.voice);
});
// voice input (Web Speech API, free, in the browser)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
mic.addEventListener("click", () => {
  if (!SR) { showBubble(T("Reconnaissance vocale non supportée : utilisez Chrome ou Edge.", "Speech recognition not supported: use Chrome or Edge.")); return; }
  if (rec) { rec.stop(); return; }
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = ARGS.lang === "en" ? "en-US" : "fr-FR"; rec.interimResults = true; rec.maxAlternatives = 1;
  let final = "";
  rec.onstart = () => { mic.classList.add("live"); setMood("listening"); };
  rec.onresult = (e) => {
    let txt = ""; for (const r of e.results) { txt += r[0].transcript; if (r.isFinal) final = txt; }
    showBubble("🎙 " + txt);
  };
  rec.onerror = (e) => showBubble(T("Micro : ", "Mic: ") + e.error);
  rec.onend = () => {
    mic.classList.remove("live"); rec = null;
    if (final.trim()) { setMood("thinking"); heardId = Date.now(); send("streamlit:setComponentValue", { value: { text: final.trim(), id: heardId }, dataType: "json" }); }
    else setMood("idle");
  };
  rec.start();
});

// ------------------------------------------------------------------ animation loop
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime(), now = performance.now();
  look.lerp(target, 0.08);
  // idle float + hop
  const hop = Math.max(0, 1 - (now - jumpAt) / 600);
  robot.position.y = Math.sin(t * 1.3) * 0.08 + Math.sin(hop * Math.PI) * 0.3;
  robot.rotation.y = look.x * 0.18;
  head.rotation.y = look.x * 0.32 + Math.sin(t * 0.7) * 0.03;
  head.rotation.x = -look.y * 0.22 + (mood === "thinking" ? -0.15 : 0);
  head.rotation.z = Math.sin(t * 0.9) * 0.025 + (mood === "listening" ? 0.12 : 0);
  // eyes follow the cursor + blink; happy squint while talking
  eyes.position.x = look.x * 0.07; eyes.position.y = 0.06 + look.y * 0.04 + (mood === "thinking" ? 0.06 : 0);
  if (now > blinkAt) { blinkStart = now; blinkAt = now + 2600 + Math.random() * 3600; }
  const b = Math.max(0, 1 - Math.abs(now - blinkStart - 80) / 80);
  const talking = mood === "talking" && now < talkUntil;
  if (mood === "talking" && now >= talkUntil) setMood("idle");
  const squint = talking ? 0.72 : mood === "thinking" ? 0.55 : 1;
  for (const s of [-1, 1]) eye[s].g.scale.y += ((1 - Math.min(0.94, b)) * squint - eye[s].g.scale.y) * 0.35;
  // mouth dots → equalizer
  energy = Math.max(0, energy - 0.04);
  bars.forEach((bar, i) => {
    const mid = 1 - Math.abs(i - 2) / 3;
    let h = 1;
    if (talking) h = 1 + mid * (2.4 + 1.8 * Math.abs(Math.sin(t * 12 + i * 1.9))) * (0.75 + energy * 0.4);
    else if (mood === "listening") h = 1 + 0.9 * Math.abs(Math.sin(t * 6 + i));
    else if (mood === "thinking") h = 1 + 1.2 * Math.max(0, Math.sin(t * 4 - i * 0.8));
    bar.scale.y += (h - bar.scale.y) * 0.3;
  });
  // floating hands: gentle bob, the left one waves on greeting
  const waving = now < waveUntil;
  for (const s of [-1, 1]) {
    const a = arms[s];
    a.shoulder.position.y = -1.55 + Math.sin(t * 1.8 + s) * 0.05;
    a.shoulder.position.x = s * (1.22 + (talking ? 0.04 * Math.sin(t * 5 + s) : 0));
  }
  R.shoulder.position.y += waving ? 0.85 : 0;
  R.shoulder.position.x += waving ? -0.15 : 0;
  R.elbow.rotation.z = waving ? Math.sin(t * 10) * 0.55 : R.elbow.rotation.z * 0.9;
  // light breathes; brighter when listening
  glow.emissiveIntensity = 2.1 + Math.sin(t * 2.4) * 0.35 + (mood === "listening" ? 1.2 : 0);
  seam.material.opacity = 0.55 + 0.25 * Math.sin(t * 1.6);
  neckGlow.material.opacity = 0.7 + 0.3 * Math.sin(t * 2);
  tips.forEach((m) => m.scale.setScalar(1 + 0.18 * Math.sin(t * 4) + (mood === "listening" ? 0.4 : 0)));
  shadow.scale.setScalar(1 - (robot.position.y) * 0.25);
  rings[0].material.opacity = 0.35 + 0.2 * Math.sin(t * 1.4);
  renderer.render(scene, camera);
}
setMood("idle"); resize(); loop();
speechSynthesis && speechSynthesis.getVoices();
send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: ARGS.height });
</script>
</body>
</html>
