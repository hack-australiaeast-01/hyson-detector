name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-api.txt
      - name: Install
        run: pip install -r app/requirements-api.txt pytest
      - name: Tests (offline snapshot, no Fabric / Azure OpenAI call)
        env:
          DATA_SOURCE: local
          COPILOT_OFFLINE: "1"
        run: python -m pytest -q
